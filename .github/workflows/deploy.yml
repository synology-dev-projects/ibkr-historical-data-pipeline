name: Branch-Based Deployment Pipeline

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-branch:
    runs-on: self-hosted

    steps:
      # 1. CLEANUP (Runner Workspace)
      - name: Clean Runner Workspace
        run: |
          echo "🧹 Cleaning previous runner artifacts..."
          rm -rf ./*
          rm -rf ./.??*

      # 2. CHECKOUT
          # --- SETUP ---
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}

      # 3. SETUP VARIABLES (Calculate Path EARLY)
      - name: Configure Deployment Paths
        run: |
          # Load Synology Root
          umask 002
          cat ../../conf/syno_paths.env >> $GITHUB_ENV
          
          # Calculate Variables
          BRANCH_NAME="${{ github.ref_name }}"
          REPO_NAME="${{ github.event.repository.name }}"
          
          # Read SYNOLOGY_ROOT_PATH from the file we just loaded
          source ../../conf/syno_paths.env
          TARGET_PATH="${SYNOLOGY_ROOT_PATH}/${BRANCH_NAME}/${REPO_NAME}"
          
          echo "📂 Target Path: $TARGET_PATH"
          echo "DEPLOY_DIR=$TARGET_PATH" >> $GITHUB_ENV

      # 3.5 Pre-Flight Test Gate
      - name: Run Pre-Flight Test Gate
        run: |
          echo "🧪 Running IBKR-Historical-Data Pytest Suite..."
          pytest tests/ -v

      # 4. DEPLOY CODE (Copy files BEFORE installing deps)
      - name: Sync Code to Project Root
        run: |
          TARGET_PATH="${{ env.DEPLOY_DIR }}"
          mkdir -p "$TARGET_PATH"

          # Wipe OLD source code to ensure deleted files are removed
          # NOTE: We do NOT delete .venv, allowing it to persist!
          echo "🧹 Wiping old src/, tests/, and configs..."
          rm -rf "$TARGET_PATH"/*
 
          # Copy NEW files to the persistent project root
          echo "🚀 Copying new files..."
          cp -r src "$TARGET_PATH/"
          cp -r tests "$TARGET_PATH/"
          cp verify.sh "$TARGET_PATH/"
          
          sudo chown -R 1026:100 "$TARGET_PATH"
          chmod -R 775 "$TARGET_PATH"
          
          
          # Copy requirement files if they exist
          [ -f requirements.txt ] && cp requirements.txt "$TARGET_PATH/"
          [ -f requirements.in ] && cp requirements.in "$TARGET_PATH/"

      # 5. MANAGE VENV (Run execution INSIDE Project Root)
      - name: Update Project Virtualenv
        run: |
          cd "${{ env.DEPLOY_DIR }}"
          
          # 1. Create .venv only if it doesn't exist (Persists between runs!)
          if [ ! -d ".venv" ]; then
            echo "🔨 Creating new virtual environment in project root..."
            python3 -m venv .venv
          else
            echo "✅ Existing .venv found. Updating..."
          fi
          
          # 2. Activate
          source .venv/bin/activate
          pip install --upgrade pip pip-tools
          echo "🧹 Status before cleanup:"
          ls -l requirements.txt || echo "File not found (Good)"
          
          # 3. Compile/Install
          if [ -f "requirements.in" ]; then
            echo "🔄 Compiling requirements.in..."
            pip-compile requirements.in --output-file=requirements.txt
          fi
          
          echo "📦 Installing dependencies..."
          pip install -r requirements.txt
          
          # Inject the local shared library safely
          if [ -d "../common-lib" ]; then
            echo "📦 Installing local common-lib from ../common-lib..."
            pip install -e ../common-lib
          elif [ -d "/volume2/homes/rachardv/git-repos/master/common-lib" ]; then
            echo "📦 Installing local common-lib from master..."
            pip install -e /volume2/homes/rachardv/git-repos/master/common-lib
          elif [ -d "/volume2/homes/rachardv/git-repos/develop/common-lib" ]; then
            echo "📦 Installing local common-lib from develop..."
            pip install -e /volume2/homes/rachardv/git-repos/develop/common-lib
          fi
          
          # 4. Add to Path (so verify.sh finds it)
          echo "$PWD/.venv/bin" >> $GITHUB_PATH

      # 6. IN-SITU MODULE SMOKE CHECK
      - name: Verify Module Imports
        run: |
          echo "📡 Verifying IBKR pipeline module imports on Synology runner..."
          cd "${{ env.DEPLOY_DIR }}"
          export PATH="$(pwd)/.venv/bin:$PATH"
          python -c "import src.extract, src.transform, src.load; print('✅ ibkr-historical-data-pipeline modules import cleanly!')"

      # 7. MERGE LOGIC (Unchanged)
      - name: Auto-Promote to Master
        if: github.ref_name == 'develop'
        run: |
          echo "✅ Develop verified. Promoting to Master..."
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git fetch origin develop
          git checkout master
          git pull origin master
          git merge origin/develop --no-ff -m "Auto-merge develop to master [Skip CI]"
          git push origin master